<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapider Intellectual Property &amp; Patent Management</title>
  <script src="https://kit.fontawesome.com/5b23df26dc.js" crossorigin="anonymous" defer></script>
  <script src="/assets/js/rapider-components.js" defer></script>
  <link rel="stylesheet" href="/assets/themes/rapider-tailwind-theme.css">
  <link rel="stylesheet" href="/assets/themes/crm-expenses-design.css">
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
    iframe#appFrame { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <iframe id="appFrame" src="pages/ip-dashboard/ip-dashboard.html"></iframe>
  <script>
    const routes = {
  "ip-dashboard": "pages/ip-dashboard/ip-dashboard.html",
  "invention-disclosures": "pages/invention-disclosures/invention-disclosures.html",
  "patent-families": "pages/patent-families/patent-families.html",
  "prosecution-docket": "pages/prosecution-docket/prosecution-docket.html",
  "trademarks-domains": "pages/trademarks-domains/trademarks-domains.html",
  "brand-watch-disputes": "pages/brand-watch-disputes/brand-watch-disputes.html",
  "annuities-pruning": "pages/annuities-pruning/annuities-pruning.html",
  "product-marking-licensing": "pages/product-marking-licensing/product-marking-licensing.html",
  "inventor-awards": "pages/inventor-awards/inventor-awards.html",
  "ip-asset-detail": "pages/ip-asset-detail/ip-asset-detail.html",
  "idf-detail": "pages/idf-detail/idf-detail.html",
  "ip-drawer": "pages/ip-drawer/ip-drawer.html"
};
    function handleHash() {
      const hash = window.location.hash.replace(/^#\/?/, '').split('?')[0];
      const route = hash || 'ip-dashboard';
      const target = routes[route] || routes['ip-dashboard'];
      const iframe = document.getElementById('appFrame');
      if (iframe) iframe.src = target;
    }
    window.addEventListener('hashchange', handleHash);
    window.addEventListener('load', handleHash);
  </script>
</body>
</html>
